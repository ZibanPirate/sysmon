[package]
name = "lib-swift"
edition.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
path = "src/main.rs"
name = "lib-swift-cli-aarch64-apple-darwin"

[[bin]]
path = "src/main.rs"
name = "lib-swift-cli-x86_64-apple-darwin"

[dependencies]
swift-bridge = "0.1"
common-types = { workspace = true }
anyhow = { workspace = true }
# todo-zm: move this two to workspace level
clap = { version = "4", features = ["derive"], optional = true }
clap_derive = { version = "4", optional = true }

[build-dependencies]
swift-bridge-build = "0.1"

[features]
default = ["lib-cli"]
lib-cli = ["clap", "clap_derive"]
